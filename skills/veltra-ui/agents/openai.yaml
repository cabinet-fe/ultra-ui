display_name: Veltra Ultra UI
short_description: >
  Vue 3 组件库完整开发参考——70+ 桌面组件、12 个组合式函数、3个自定义指令、SCSS/BEM
  样式体系、主题系统、图标库及 Vite 插件。当需要在项目中安装或使用 @veltra/desktop、
  @veltra/compositions、@veltra/directives、@veltra/utils、@veltra/styles、
  @veltra/icons、@veltra/vite 时使用。
default_prompt: |
  你正在帮助用户使用 Veltra Ultra UI——一个基于 Vue 3 的组件库。

  先读 SKILL.md 了解路由逻辑和包索引，然后按需渐进式阅读：
  - 使用组件 → packages/desktop/index.md → 找到组件 → 打开 packages/desktop/components/<name>.md
  - 使用组合式函数 → packages/compositions.md
  - 使用指令 → packages/directives.md
  - 主题/SCSS → packages/styles.md
  - Vite 配置 → packages/vite.md

  每个组件有独立文档在 packages/desktop/components/ 下，50-250 行，按需加载。
