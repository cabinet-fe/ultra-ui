schema: spec-driven

context: |
  Ultra UI - Vue 3 组件库，提供 60+ 组件
  Tech stack: Vue 3.5+, TypeScript 5.9, SCSS, Vite (Rolldown), Vitest, Bun
  Monorepo (bun workspaces): ui/, sample/, build/, cli/
  组件位于 ui/components/<kebab-name>/，每个组件包含 index.vue、type.ts、style.ts 等
  组件前缀: U (如 UButton, UInput)
  使用 cat-kit 工具库和 @ultra/icon 图标库
  代码规范: 早返回减少嵌套、避免出现超大函数、完整的 TS 类型注解、超过 3 个参数合并为对象

rules:
  tasks:
    - 每个 task 应聚焦于单个组件或模块的变更
