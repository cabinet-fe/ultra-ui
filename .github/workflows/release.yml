name: Release

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/*/CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest
    env:
      # Bun 将依赖放在 node_modules/.bun/pkg@ver/node_modules/pkg，simple-git-hooks
      # 会误判项目根并 ENOENT；CI 也不需要写本地 git hooks。
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate release branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            echo "Manual release is only allowed from dev, current ref: ${{ github.ref }}"
            exit 1
          fi

      # Bun 运行时（读取 package.json packageManager）；发布脚本与 changeset 依赖 bun 命令。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # setup-vp 装载 Vite+、Node.js，并通过 vp install 安装依赖。
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.10.0
        with:
          node-version: '24'
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      # 全量构建一次（vp run 按 workspace 拓扑排序）；lint 与构建并行，测试在构建完成后执行
      - name: Verify
        run: |
          vp lint &
          lint_pid=$!
          vp run --filter '@veltra/*' --filter '!@veltra/mobile' build
          build_status=$?
          vp test &
          test_pid=$!
          wait $lint_pid
          lint_status=$?
          wait $test_pid
          test_status=$?
          exit $((build_status | lint_status | test_status))

      # .npmrc 不入库；发布前在 CI 写入 npmjs registry 与 token。
      - name: Configure npm registry for publish
        run: |
          printf '%s\n' 'registry=https://registry.npmjs.org/' > .npmrc
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Normalize package manifests for publish
        run: bun run scripts/normalize-release-manifests.ts

      - name: Publish to npm and collect release data
        id: changesets
        uses: changesets/action@v1.8.0
        with:
          publish: bun run changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub releases
        if: steps.changesets.outputs.published == 'true'
        run: bun run scripts/create-github-releases.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
