name: Release

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/*/CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest
    env:
      # Bun 将依赖放在 node_modules/.bun/pkg@ver/node_modules/pkg，simple-git-hooks
      # 会误判项目根并 ENOENT；CI 也不需要写本地 git hooks。
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            echo "Manual release is only allowed from dev, current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Run tests
        run: bun run test

      - name: Build packages
        run: bun run build:packages

      # 仓库 .npmrc 默认指向安装镜像；发布前必须显式切回 npmjs。
      - name: Configure npm registry for publish
        run: |
          printf '%s\n' 'registry=https://registry.npmjs.org/' > .npmrc
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Normalize package manifests for publish
        run: bun run scripts/normalize-release-manifests.ts

      - name: Publish to npm and collect release data
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub releases
        if: steps.changesets.outputs.published == 'true'
        run: bun run scripts/create-github-releases.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
