name: 版本发布

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/*/CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: 构建与发布
    runs-on: ubuntu-latest
    env:
      # Bun 将依赖放在 node_modules/.bun/pkg@ver/node_modules/pkg，simple-git-hooks
      # 会误判项目根并 ENOENT；CI 也不需要写本地 git hooks。
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验发布分支
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            echo "Manual release is only allowed from dev, current ref: ${{ github.ref }}"
            exit 1
          fi

      # Bun 运行时（读取 package.json packageManager）；发布脚本与 changeset 依赖 bun 命令。
      - name: 安装 Bun 运行环境
        uses: oven-sh/setup-bun@v2

      # setup-vp 装载 Vite+、Node.js，并通过 vp install 安装依赖。
      # node-version '24' 固定大版本、解析为该线最新版（>=24.21.0），落在
      # vite-plus 1.0.0-rc.0 的 CLI 范围 ^22.18.0 || ^24.11.0 || >=26.0.0 内；
      # 其 vp staged 所用 lint-staged@17.5.1 要求
      # ^22.22.1 || ^24.11.0 || >=26.0.0，同样满足，无需固化具体小版本。
      - name: 安装 Vite+ 与依赖
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true
          run-install: true

      # exports 已无 veltra-dev 条件，lint/test 的类型与运行时解析都指向
      # dist，必须先全量构建，再并行执行 lint 与 test
      - name: 全量构建
        run: vp run --filter '@veltra/*' --filter '!@veltra/mobile' build

      - name: 代码校验与测试
        run: |
          vp lint &
          lint_pid=$!
          vp test &
          test_pid=$!
          wait $lint_pid
          lint_status=$?
          wait $test_pid
          test_status=$?
          exit $((lint_status | test_status))

      - name: 规范化待发布 package.json
        run: bun run scripts/normalize-release-manifests.ts

      - name: 发布到 npm 并收集发布数据
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          publish-script: bun run changeset publish
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Releases
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        run: bun run scripts/create-github-releases.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
