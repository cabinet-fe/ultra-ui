name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    name: Publish and create GitHub Release
    runs-on: ubuntu-latest
    # Bun 将依赖放在 node_modules/.bun/pkg@ver/node_modules/pkg，simple-git-hooks
    # 会误判项目根并 ENOENT；CI 也不需要写本地 git hooks。
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish to npm
        run: bun run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare release notes from changelog
        id: notes
        run: |
          set -euo pipefail
          cl="packages/desktop/CHANGELOG.md"
          if [ -f "$cl" ]; then
            awk '/^## /{if (p) exit; p=1} p' "$cl" > .release-body.md
            if [ -s .release-body.md ]; then
              echo "source=changelog" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "source=generated" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (changelog)
        if: steps.notes.outputs.source == 'changelog'
        uses: softprops/action-gh-release@v2
        with:
          body_path: .release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (generated)
        if: steps.notes.outputs.source == 'generated'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
